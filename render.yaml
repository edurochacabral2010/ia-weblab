services:
  - type: web
    name: ia-weblab
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ia-weblab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_NAME
        value: Professor
      - key: TEACHER_EMAIL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna

databases:
  - name: ia-weblab-db
    plan: free
    region: ohio
